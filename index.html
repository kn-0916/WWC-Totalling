<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わんだふるちきん 集計</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#26324d;--sub:#6b7a99;--line:#cfdcef;--acc:#ff9f1c;--grass:#5fc35a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);padding-top:env(safe-area-inset-top,0px);
font:500 15px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
background:linear-gradient(#5bb8f5 0,#aee1ff 50%,#e2f7ff 100%) fixed}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#grass{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:0;pointer-events:none;
background:linear-gradient(#6cc24a 0 12px,#4f9a36 12px 16px,#8b5a2b 16px 100%)}
.ck{position:absolute;left:0;will-change:transform;animation:fly var(--d) linear var(--dl) infinite}
.ck.r{animation-name:flyR}
.ck .fl{width:100%;height:100%}.ck.r .fl{transform:scaleX(-1)}
.ck svg{display:block;width:100%;height:100%;animation:bob .5s steps(2,jump-none) infinite;
filter:drop-shadow(2px 0 0 #26324d) drop-shadow(-2px 0 0 #26324d) drop-shadow(0 2px 0 #26324d) drop-shadow(0 -2px 0 #26324d)}
@keyframes fly{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
@keyframes flyR{from{transform:translateX(calc(100vw + 140px))}to{transform:translateX(-140px)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-8%)}100%{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#bg{display:none}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px 16px calc(64px + env(safe-area-inset-bottom,0px))}
h1{display:flex;align-items:center;gap:14px;margin:6px 0 18px;font:400 clamp(24px,6vw,38px)/1.2 "Mochiy Pop One","Zen Maru Gothic",sans-serif;
color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);letter-spacing:.04em}
h1 img{width:64px;height:64px;border-radius:16px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#fff}
h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:400 18px/1.3 "Mochiy Pop One","Zen Maru Gothic",sans-serif}
h2::before{content:"";width:12px;height:12px;background:var(--acc);border:2px solid var(--ink);transform:rotate(45deg)}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:18px;box-shadow:5px 5px 0 var(--ink)}
.sub{color:var(--sub);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--ink);background:#f5fbff;border:2px solid var(--ink);border-radius:12px;padding:6px 12px}
button{cursor:pointer;background:#fff;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:hover{background:#fff6e0}button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
button.p{background:var(--acc)}button.p:hover{background:#ffb347}
button.s{padding:0 9px;font-size:12px;box-shadow:0 2px 0 var(--ink);border-radius:9px}
button.s:active{transform:translateY(2px);box-shadow:none}
input:focus,select:focus,textarea:focus{outline:3px solid #ffd27a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rank{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:2px dotted var(--line)}
.rank .n{flex:1}.rank .d{color:var(--sub);font-size:12px}
.rank .i{background:var(--ink);color:#fff;border-radius:8px;min-width:1.8em;text-align:center;font-size:12px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.grid>div{background:#f5fbff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.fgrid label{font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.fgrid select{width:100%}
.bar{display:grid;grid-template-columns:6em 1fr 6.5em;gap:6px;align-items:center;font-size:13px;margin:4px 0}
.wide .bar{grid-template-columns:10em 1fr 6.5em}
.bar .t{background:#fff;border:2px solid var(--ink);border-radius:9px;height:16px;overflow:hidden}
.bar .t i{display:block;height:100%;border-right:2px solid var(--ink)}
.bar .v{text-align:right;color:var(--sub);white-space:nowrap;font-weight:700}
.bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border-bottom:2px solid var(--line);padding:6px 8px;text-align:left}
th{background:#eaf6ff;color:var(--ink);font-weight:900}td.w{white-space:normal;min-width:12em}
.empty{color:var(--sub)}
#msg{background:#fff3cd}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ck" viewBox="0 0 14 12">
<rect x="1" y="3" width="2" height="3" fill="#f2f2f6"/>
<rect x="2" y="4" width="8" height="5" fill="#fbfbff"/><rect x="2" y="8" width="8" height="1" fill="#d6d9e6"/>
<rect x="4" y="5" width="4" height="3" fill="#e3e6f2"/>
<rect x="9" y="1" width="3" height="4" fill="#fbfbff"/><rect x="10" y="2" width="1" height="1" fill="#2a1d1d"/>
<rect x="12" y="2" width="2" height="2" fill="#f5a623"/><rect x="12" y="4" width="1" height="1" fill="#d62828"/>
<rect x="5" y="9" width="1" height="3" fill="#e8a53a"/><rect x="8" y="9" width="1" height="3" fill="#e8a53a"/>
<rect x="5" y="11" width="2" height="1" fill="#e8a53a"/><rect x="8" y="11" width="2" height="1" fill="#e8a53a"/>
</symbol></svg>
<div id="bg" aria-hidden="true"></div><div id="grass" aria-hidden="true"></div>
<main>
<div class="card" id="msg" style="display:none"></div>
<h1><img src="icon.png" alt=""><span>わんだふるちきん 集計</span></h1>

<div class="card row"><span id="who" class="sub" style="flex:1"></span>
<button class="p" id="login">Googleでログイン</button><button id="logout" style="display:none">ログアウト</button></div>

<div class="card">
<h2>ランク</h2>
<div id="ranks"></div>
<div class="row ed" style="margin-top:10px">
<input id="rnew" placeholder="ランク名" style="flex:1;min-width:180px">
<select id="rpos"><option value="end">一番下に追加</option><option value="top">一番上に追加</option></select>
<button class="p" id="radd">追加</button>
</div>
</div>

<div class="card">
<h2>性格</h2>
<div id="plist"></div>
<div class="row ed" style="margin-top:10px">
<textarea id="pnew" rows="2" placeholder="性格" style="flex:1;min-width:200px"></textarea>
<button class="p" id="padd">追加</button>
</div>
</div>

<div class="card">
<h2>特性</h2>
<div id="tlist"></div>
<div class="row ed" style="margin-top:10px">
<textarea id="tnew" rows="2" placeholder="名前:説明" style="flex:1;min-width:200px"></textarea>
<button class="p" id="tadd">追加</button>
</div>
</div>

<div class="card ed">
<h2 id="ftitle">個体を追加</h2>
<div class="row"><input id="cname" placeholder="名前・メモ" style="flex:1;min-width:180px"></div>
<div class="fgrid" id="fields"></div>
<div class="row"><button class="p" id="csave">追加</button><button id="ccancel" style="display:none">編集をやめる</button></div>
</div>

<div class="card">
<h2>ランク割合 <span class="sub" id="cnt"></span></h2>
<div class="grid" id="sum"></div>
</div>

<div class="card">
<h2>登録済みの個体</h2>
<div class="sc" id="list"></div>
</div>
</main>

<script>
(()=>{
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const bg=document.getElementById("bg");
 for(let i=0;i<11;i++){
  const w=34+Math.random()*62,r=Math.random()<.45,d=16+Math.random()*26;
  const e=document.createElement("div");e.className="ck"+(r?" r":"");
  e.style.cssText=`top:${3+Math.random()*86}%;width:${w}px;height:${w*12/14}px;--d:${d}s;--dl:-${Math.random()*d}s;opacity:${.6+Math.random()*.4}`;
  e.innerHTML='<div class="fl"><svg viewBox="0 0 14 12" shape-rendering="crispEdges"><use href="#ck"/></svg></div>';
  bg.appendChild(e);
 }
})();
</script>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBQfshxge8qi92XdUejMPfaiDbnLrO1ZPU",
  authDomain: "wwc-totalling.firebaseapp.com",
  projectId: "wwc-totalling",
  storageBucket: "wwc-totalling.firebasestorage.app",
  messagingSenderId: "782157669658",
  appId: "1:782157669658:web:f66f31162cec63cba578a3",
  measurementId: "G-M1H5NH2GLM"
};

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const STATS=["最大体力","サイズ","地上速度","空中速度","上昇速度","ジャンプ力","段差無視","スタミナ","スタミナ回復"];
let me=null,lists={personalities:[],traits:[]},ranks=[],chickens=[],editId=null,fdb=null,auth=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const color=i=>{const n=Math.max(ranks.length-1,1);return `hsl(${Math.round(135-i/n*135)},70%,58%)`};
const rname=id=>(ranks.find(r=>r.id===id)||{}).name;
const lname=(k,id)=>(lists[k].find(r=>r.id===id)||{}).name;
const parse=s=>{const m=s.match(/^([^:：]+)[:：](.*)$/);return m?{name:m[1].trim(),desc:m[2].trim()}:{name:s.trim(),desc:""}};
const mine=x=>me&&x.uid===me.uid;
const fail=e=>alert("保存できませんでした："+((e&&e.code)||(e&&e.message)||"不明なエラー"));
const cref=n=>collection(fdb,n), dref=(n,id)=>doc(fdb,n,id);

function renderRanks(){
 const b=(a,i,t)=>`<button class="s" data-a="${a}" data-i="${i}">${t}</button>`;
 $("ranks").innerHTML=ranks.length?ranks.map((r,i)=>`<div class="rank"><span class="i">${i+1}</span><span class="n">${esc(r.name)}</span>${me?b("up",i,"↑")+b("dn",i,"↓"):""}${mine(r)?b("rn",i,"名前変更")+b("del",i,"削除"):""}</div>`).join(""):'<div class="empty">—</div>';
}
function renderFields(vals={}){
 const opts=(L,v)=>`<option value="">未入力</option>`+L.map(r=>`<option value="${r.id}"${r.id===v?" selected":""}>${esc(r.name)}</option>`).join("");
 $("fields").innerHTML=STATS.map((k,i)=>`<label>${k}<select data-k="${i}">${opts(ranks,vals[i])}</select></label>`).join("")
  +`<label>性格<select data-k="p">${opts(lists.personalities,vals.p)}</select></label><label>特性<select data-k="t">${opts(lists.traits,vals.t)}</select></label>`;
}
function renderSimple(id,key){
 const L=lists[key];
 $(id).innerHTML=L.length?L.map((r,i)=>`<div class="rank"><span class="n">${esc(r.name)}${r.desc?` <span class="d">${esc(r.desc)}</span>`:""}</span>${mine(r)?`<button class="s" data-l="${key}" data-a="rn" data-i="${i}">編集</button><button class="s" data-l="${key}" data-a="del" data-i="${i}">削除</button>`:""}</div>`).join(""):'<div class="empty">—</div>';
}
function readForm(){const o={};document.querySelectorAll("#fields select").forEach(s=>{if(s.value)o[s.dataset.k]=s.value});return o}
function bars(list,total){
 if(!total)return'<div class="empty">—</div>';
 const max=Math.max(...list.map(c=>c.n),1);
 return list.map(c=>`<div class="bar"><span class="l" title="${esc(c.r)}">${esc(c.r)}</span><span class="t"><i style="width:${c.n/max*100}%;background:${c.col}"></i></span><span class="v">${c.n}件 ${(c.n/total*100).toFixed(1)}%</span></div>`).join("");
}
function renderSum(){
 $("cnt").textContent=`（${chickens.length}体）`;
 $("sum").innerHTML=STATS.map((k,i)=>{
  const vals=chickens.map(c=>c.s&&c.s[i]).filter(v=>v&&rname(v));
  const list=ranks.map((r,j)=>({r:r.name,n:vals.filter(v=>v===r.id).length,col:color(j)}));
  return `<div><b>${k}</b> <span class="sub">(${vals.length}件)</span>${bars(list,vals.length)}</div>`}).join("")+[["性格","personalities","personality"],["特性","traits","trait"]].map(([t,k,f])=>{
  const L=lists[k],vals=chickens.map(c=>c[f]).filter(v=>L.some(r=>r.id===v));
  const list=L.map(r=>({r:r.name,n:vals.filter(v=>v===r.id).length,col:"var(--acc)"}));
  return `<div class="wide"><b>${t}</b> <span class="sub">(${vals.length}件)</span>${bars(list,vals.length)}</div>`}).join("");
}
function renderList(){
 if(!chickens.length){$("list").innerHTML='<div class="empty">—</div>';return}
 $("list").innerHTML=`<table><tr><th>#</th><th>名前</th>${STATS.map(k=>`<th>${k}</th>`).join("")}<th>性格</th><th>特性</th><th>登録者</th><th></th></tr>`+
 chickens.map((c,n)=>`<tr><td>${n+1}</td><td>${esc(c.name||"-")}</td>${STATS.map((_,i)=>`<td>${esc(rname(c.s&&c.s[i])||"-")}</td>`).join("")}<td class="w">${esc(lname("personalities",c.personality)||"-")}</td><td>${esc(lname("traits",c.trait)||"-")}</td><td>${esc(c.uname||"-")}</td>
 <td>${mine(c)?`<button class="s" data-e="${c.id}">編集</button> <button class="s" data-d="${c.id}">削除</button>`:""}</td></tr>`).join("")+"</table>";
}
function renderAll(){
 const v=readForm();
 if(editId&&!chickens.some(c=>c.id===editId&&mine(c)))stopEdit();
 document.querySelectorAll(".ed").forEach(e=>e.style.display=me?"":"none");
 $("who").textContent=me?(me.displayName||me.email||"ユーザー"):"";
 $("login").style.display=me?"none":"";$("logout").style.display=me?"":"none";
 renderRanks();renderSimple("plist","personalities");renderSimple("tlist","traits");renderFields(v);renderSum();renderList();
}
function stopEdit(){editId=null;$("ftitle").textContent="個体を追加";$("csave").textContent="追加";$("ccancel").style.display="none"}

$("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
$("logout").onclick=()=>signOut(auth);

$("radd").onclick=async()=>{
 if(!me)return;
 const names=[...new Set($("rnew").value.split(/[,、\n]/).map(s=>s.trim()).filter(s=>s&&s.length<=40&&!ranks.some(r=>r.name===s)))];
 if(!names.length)return;
 const top=$("rpos").value==="top";
 let lo=ranks.length?ranks[0].order:0,hi=ranks.length?ranks[ranks.length-1].order:0;
 try{
  for(const n of top?names.slice().reverse():names)
   await addDoc(cref("ranks"),{name:n,order:top?--lo:++hi,uid:me.uid});
  $("rnew").value="";
 }catch(e){fail(e)}
};
$("ranks").onclick=async e=>{
 const b=e.target.closest("button");if(!b||!me)return;
 const i=+b.dataset.i,a=b.dataset.a,r=ranks[i];
 try{
  if(a==="up"||a==="dn"){const o=ranks[a==="up"?i-1:i+1];if(!o)return;
   const w=writeBatch(fdb);w.update(dref("ranks",r.id),{order:o.order});w.update(dref("ranks",o.id),{order:r.order});await w.commit()}
  if(a==="rn"){const nn=(prompt("新しいランク名",r.name)||"").trim();
   if(!nn||nn.length>40||ranks.some(x=>x.name===nn&&x.id!==r.id))return;await updateDoc(dref("ranks",r.id),{name:nn})}
  if(a==="del"){if(!confirm(`「${r.name}」を削除しますか？みんなの画面から消え、このランクの入力は未入力扱いになります。`))return;
   await deleteDoc(dref("ranks",r.id))}
 }catch(err){fail(err)}
};
const SK={personalities:["pnew","personalities"],traits:["tnew","traits"]};
for(const [btn,key] of [["padd","personalities"],["tadd","traits"]]){
 $(btn).onclick=async()=>{
  if(!me)return;const inp=$(SK[key][0]);
  const items=inp.value.split("\n").map(parse).filter(x=>x.name&&x.name.length<=60&&x.desc.length<=200&&!lists[key].some(r=>r.name===x.name));
  const uniq=items.filter((x,i)=>items.findIndex(y=>y.name===x.name)===i);
  if(!uniq.length)return;
  try{let n=Date.now();for(const x of uniq)await addDoc(cref(key),{name:x.name,desc:x.desc,uid:me.uid,at:n++});inp.value=""}catch(e){fail(e)}
 };
}
for(const id of ["plist","tlist"])$(id).onclick=async e=>{
 const b=e.target.closest("button");if(!b||!me)return;
 const key=b.dataset.l,r=lists[key][+b.dataset.i];if(!r||!mine(r))return;
 try{
  if(b.dataset.a==="rn"){const v=prompt("名前:説明（説明は省略可）",r.desc?r.name+":"+r.desc:r.name);if(v===null)return;
   const x=parse(v);if(!x.name||x.name.length>60||x.desc.length>200||lists[key].some(y=>y.name===x.name&&y.id!==r.id))return;
   await updateDoc(dref(key,r.id),{name:x.name,desc:x.desc})}
  if(b.dataset.a==="del"){if(!confirm(`「${r.name}」を削除しますか？この項目の入力は未入力扱いになります。`))return;await deleteDoc(dref(key,r.id))}
 }catch(err){fail(err)}
};
$("csave").onclick=async()=>{
 if(!me)return;
 const o=readForm(),{p,t,...s}=o,name=$("cname").value.trim().slice(0,60);
 if(!Object.keys(o).length&&!name)return;
 try{
  if(editId)await updateDoc(dref("chickens",editId),{name,s,personality:p||"",trait:t||""});
  else await addDoc(cref("chickens"),{name,s,personality:p||"",trait:t||"",uid:me.uid,uname:(me.displayName||"匿名").slice(0,40),at:Date.now()});
  stopEdit();$("cname").value="";renderAll();
 }catch(e){fail(e)}
};
$("ccancel").onclick=()=>{stopEdit();$("cname").value="";renderAll()};
$("list").onclick=async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.d){if(!confirm("この個体を削除しますか？"))return;
  try{await deleteDoc(dref("chickens",b.dataset.d))}catch(err){fail(err)}}
 if(b.dataset.e){editId=b.dataset.e;const c=chickens.find(c=>c.id===editId);$("cname").value=c.name||"";
  $("ftitle").textContent="個体を編集";$("csave").textContent="保存";$("ccancel").style.display="";renderFields({...(c.s||{}),p:c.personality,t:c.trait});
  $("ftitle").scrollIntoView({behavior:"smooth"})}
};

renderAll();
if(firebaseConfig.apiKey.startsWith("YOUR_")){
 const m=$("msg");m.style.display="";m.textContent="firebaseConfig";
 $("login").style.display="none";
}else{
 const app=initializeApp(firebaseConfig);auth=getAuth(app);fdb=getFirestore(app);
 const err=e=>{const m=$("msg");m.style.display="";m.textContent="読み込みエラー："+((e&&e.code)||"")};
 onAuthStateChanged(auth,u=>{me=u;renderAll()});
 onSnapshot(cref("ranks"),s=>{ranks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.order-b.order);renderAll()},err);
 for(const key of ["personalities","traits"])
  onSnapshot(cref(key),s=>{lists[key]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));renderAll()},err);
 onSnapshot(cref("chickens"),s=>{chickens=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));renderAll()},err);
}
</script>
</body>
</html>
